<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">The Genesis Touch - 40 Variations of Michelangelo's Divine Touch</title>
  <desc id="desc">Curatorial gallery banner celebrating 40 artistic variations of Michelangelo's The Creation of Adam across technology, cosmos, philosophy, art, nature, and humanity.</desc>

  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="museumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0d14"/>
      <stop offset="50%" stop-color="#14121d"/>
      <stop offset="100%" stop-color="#0a090e"/>
    </linearGradient>

    <radialGradient id="goldAura" cx="72%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#b8860b" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="celestialSpark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#d4af37" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdfcf7"/>
      <stop offset="50%" stop-color="#e5c07b"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>

    <linearGradient id="reachArmLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="reachArmRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.8"/>
    </linearGradient>

    <pattern id="galleryGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#262235" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Canvas Frame -->
  <rect width="1200" height="440" rx="16" fill="url(#museumBg)"/>
  <rect width="1200" height="440" rx="16" fill="url(#galleryGrid)"/>
  <rect width="1200" height="440" rx="16" fill="url(#goldAura)"/>
  <rect x="1" y="1" width="1198" height="438" rx="15" fill="none" stroke="#2e2a40" stroke-width="1.5"/>

  <!-- Museum Classical Gold Corner Accents -->
  <g stroke="#d4af37" stroke-width="1.2" fill="none" opacity="0.6">
    <path d="M 24 40 L 24 24 L 40 24"/>
    <path d="M 1176 40 L 1176 24 L 1160 24"/>
    <path d="M 24 400 L 24 416 L 40 416"/>
    <path d="M 1176 400 L 1176 416 L 1160 416"/>
  </g>

  <!-- LEFT COLUMN: Curatorial Title & Philosophy -->
  <g id="gallery-left" transform="translate(60, 48)">
    <!-- Eyebrow Badge -->
    <g id="eyebrow">
      <rect x="0" y="0" width="380" height="28" rx="14" fill="#1e1b29" stroke="#d4af37" stroke-width="1" stroke-opacity="0.7"/>
      <circle cx="14" cy="14" r="4" fill="#f59e0b"/>
      <text x="26" y="19" font-family="ui-monospace, 'Courier New', monospace" font-size="11.5" font-weight="600" fill="#fde68a" letter-spacing="1.2">SISTINE DIGITAL GALLERY · 40 ART VARIATIONS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" font-family="Georgia, 'Songti SC', serif" font-size="38" font-weight="700" fill="#fdfcf7" letter-spacing="-0.5">
      The Genesis Touch
    </text>
    <text x="0" y="118" font-family="Georgia, 'Songti SC', serif" font-size="24" font-weight="600" fill="url(#goldTextGrad)">
      创世纪 · 触碰的四十种可能
    </text>

    <!-- Curatorial Statement -->
    <text x="0" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14.5" fill="#a59fad" line-height="24">
      <tspan x="0" dy="0">致敬米开朗基罗《创造亚当》西斯廷壁画经典构图，</tspan>
      <tspan x="0" dy="24">探索科技、宇宙、哲学、艺术、自然与人间温情中，</tspan>
      <tspan x="0" dy="24">生命与造物指尖相触的 40 种终极隐喻与精神觉醒。</tspan>
    </text>

    <!-- Gallery Exhibition Badges -->
    <g id="exhibition-badges" transform="translate(0, 240)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="112" height="48" rx="8" fill="#171522" stroke="#2e2a40" stroke-width="1"/>
        <text x="14" y="22" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#e5c07b">40 变奏</text>
        <text x="14" y="38" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d758a">VARIATIONS</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(122, 0)">
        <rect width="118" height="48" rx="8" fill="#171522" stroke="#d4af37" stroke-width="1" stroke-opacity="0.5"/>
        <text x="14" y="22" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#fef08a">6 大主题</text>
        <text x="14" y="38" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d758a">THEME REALMS</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(250, 0)">
        <rect width="118" height="48" rx="8" fill="#171522" stroke="#2e2a40" stroke-width="1"/>
        <text x="14" y="22" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#34d399">-94% 体积</text>
        <text x="14" y="38" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d758a">WEBP 渐进加载</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(378, 0)">
        <rect width="124" height="48" rx="8" fill="#171522" stroke="#2e2a40" stroke-width="1"/>
        <text x="14" y="22" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#67e8f9">双主题</text>
        <text x="14" y="38" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d758a">DARK / FRESCO</text>
      </g>
    </g>

    <!-- Visit Link & Command Bar -->
    <g id="visit-bar" transform="translate(0, 310)">
      <rect width="502" height="36" rx="6" fill="#0b0a0f" stroke="#2a2638" stroke-width="1"/>
      <text x="14" y="23" font-family="ui-monospace, monospace" font-size="12.5" fill="#d4af37">✦</text>
      <text x="32" y="22" font-family="ui-monospace, monospace" font-size="12.5" fill="#e2e8f0">the-creation-variants.xiaosang.cc</text>
      <text x="360" y="22" font-family="ui-monospace, monospace" font-size="11" fill="#7d758a">Cloudflare Workers</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Iconic Michelangelo Touch Geometry & 6 Realms -->
  <g id="gallery-right" transform="translate(600, 36)">
    <!-- Main Curatorial Exhibition Display Canvas -->
    <rect width="540" height="368" rx="12" fill="#12101b" stroke="#282438" stroke-width="1.2"/>
    
    <!-- Inner Delicate Museum Inset Line -->
    <rect x="12" y="12" width="516" height="344" rx="8" fill="none" stroke="#37314d" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- TITLE OF THE VISUAL SCHEMATIC -->
    <g transform="translate(30, 36)">
      <text x="0" y="0" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#e5c07b" letter-spacing="1">COMPOSITION GEOMETRY · 指尖触碰的黄金分割</text>
      <text x="400" y="0" font-family="ui-monospace, monospace" font-size="11" fill="#7d758a">φ = 1.618</text>
    </g>

    <!-- THE SACRED REACH: Vector Hands & Electric Spark Convergence -->
    <g id="touch-convergence" transform="translate(270, 165)">
      <!-- Golden Orbit Rings -->
      <circle cx="0" cy="0" r="105" fill="none" stroke="#d4af37" stroke-width="0.6" stroke-opacity="0.2" stroke-dasharray="4 4"/>
      <circle cx="0" cy="0" r="75" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-opacity="0.35"/>
      <circle cx="0" cy="0" r="45" fill="none" stroke="#fef08a" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>

      <!-- LEFT CREATOR REACH (God / Origin / AI / Cosmos) -->
      <path d="M -230 45 C -170 30, -110 -15, -42 -4" fill="none" stroke="url(#reachArmLeft)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-42" cy="-4" r="5" fill="#fef08a" stroke="#d4af37" stroke-width="1.5"/>
      <text x="-160" y="-12" font-family="Georgia, serif" font-size="11" fill="#93c5fd" font-style="italic">造物意志 / Origin</text>

      <!-- RIGHT CREATION REACH (Adam / Human / Coder / Pupil) -->
      <path d="M 230 -25 C 170 -15, 110 15, 42 4" fill="none" stroke="url(#reachArmRight)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="42" cy="4" r="5" fill="#fef08a" stroke="#d4af37" stroke-width="1.5"/>
      <text x="75" y="25" font-family="Georgia, serif" font-size="11" fill="#fdba74" font-style="italic">生命觉醒 / Humanity</text>

      <!-- SPARK GAP & DIVINE ENERGY PULSE -->
      <!-- Center Luminescent Spark -->
      <circle cx="0" cy="0" r="28" fill="url(#celestialSpark)"/>
      <line x1="-37" y1="-3" x2="-8" y2="-1" stroke="#ffffff" stroke-width="1.8"/>
      <line x1="8" y1="1" x2="37" y2="3" stroke="#ffffff" stroke-width="1.8"/>
      
      <!-- Spark ray bursts -->
      <path d="M 0 -12 L 0 12 M -12 0 L 12 0 M -8 -8 L 8 8 M -8 8 L 8 -8" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
      <text x="0" y="26" font-family="ui-monospace, monospace" font-size="8.5" fill="#fef08a" text-anchor="middle" letter-spacing="1">THE TOUCH POINT</text>
    </g>

    <!-- SIX THEMATIC CONSTELLATION NODES -->
    <g id="realms-row" transform="translate(30, 248)">
      <!-- Realm 1: 科技与共生 -->
      <g transform="translate(0, 0)">
        <rect width="76" height="34" rx="4" fill="#0d1b2a" stroke="#38bdf8" stroke-width="0.8"/>
        <text x="38" y="15" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#7dd3fc" text-anchor="middle">科技·共生</text>
        <text x="38" y="27" font-family="ui-monospace, monospace" font-size="7.5" fill="#38bdf8" text-anchor="middle">01–06 AI·图灵</text>
      </g>
      <!-- Realm 2: 宇宙与物理 -->
      <g transform="translate(82, 0)">
        <rect width="76" height="34" rx="4" fill="#1e1833" stroke="#818cf8" stroke-width="0.8"/>
        <text x="38" y="15" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#c7d2fe" text-anchor="middle">宇宙·物理</text>
        <text x="38" y="27" font-family="ui-monospace, monospace" font-size="7.5" fill="#818cf8" text-anchor="middle">07–10 旅行者</text>
      </g>
      <!-- Realm 3: 哲学与艺术 -->
      <g transform="translate(164, 0)">
        <rect width="76" height="34" rx="4" fill="#2d1d0c" stroke="#f59e0b" stroke-width="0.8"/>
        <text x="38" y="15" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#fde68a" text-anchor="middle">哲学·艺术</text>
        <text x="38" y="27" font-family="ui-monospace, monospace" font-size="7.5" fill="#f59e0b" text-anchor="middle">11–14 梵高·大卫</text>
      </g>
      <!-- Realm 4: 自然与生灵 -->
      <g transform="translate(246, 0)">
        <rect width="76" height="34" rx="4" fill="#092518" stroke="#34d399" stroke-width="0.8"/>
        <text x="38" y="15" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#a7f3d0" text-anchor="middle">自然·生灵</text>
        <text x="38" y="27" font-family="ui-monospace, monospace" font-size="7.5" fill="#34d399" text-anchor="middle">17–20 巨杉·抹香鲸</text>
      </g>
      <!-- Realm 5: 奇幻与传说 -->
      <g transform="translate(328, 0)">
        <rect width="76" height="34" rx="4" fill="#2c1126" stroke="#f472b6" stroke-width="0.8"/>
        <text x="38" y="15" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#fbcfe8" text-anchor="middle">奇幻·传说</text>
        <text x="38" y="27" font-family="ui-monospace, monospace" font-size="7.5" fill="#f472b6" text-anchor="middle">21–25 小王子·玫瑰</text>
      </g>
      <!-- Realm 6: 人间与温情 -->
      <g transform="translate(410, 0)">
        <rect width="76" height="34" rx="4" fill="#28150c" stroke="#fb923c" stroke-width="0.8"/>
        <text x="38" y="15" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#fed7aa" text-anchor="middle">人间·温情</text>
        <text x="38" y="27" font-family="ui-monospace, monospace" font-size="7.5" fill="#fb923c" text-anchor="middle">26–31 祖父·盲犬</text>
      </g>
    </g>

    <!-- ARCHITECTURE FOOTNOTE: 3-TIER PROGRESSIVE LOADING PIPELINE -->
    <g transform="translate(30, 298)">
      <rect width="486" height="48" rx="6" fill="#0c0b11" stroke="#262235" stroke-width="1"/>
      <text x="14" y="20" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#d4af37">PROGRESSIVE IMAGE PIPELINE:</text>
      <text x="14" y="36" font-family="ui-monospace, monospace" font-size="9" fill="#9ca3af">
        600px WebP Thumbs (20KB) → 1376px HD Lightbox (150KB) → Master Archive Original (~1MB)
      </text>
      <text x="420" y="28" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#34d399">⚡ 94% FASTER</text>
    </g>
  </g>
</svg>
